name: Publish Node SDK to npm

on:
  push:
    tags:
      - 'node-sdk-v*'

jobs:
  build-and-publish:
    name: Build and publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout (full history, blobless)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: 'blob:none'

      - name: Verify tag version matches package.json
        id: verify_version
        working-directory: sdk/node
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          # Extract version from tag: node-sdk-v0.1.0 -> 0.1.0
          TAG_VERSION="${CURRENT_TAG#node-sdk-v}"
          echo "Tag version: $TAG_VERSION"

          # Extract version from package.json (top-level "version" field).
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "package.json version: $PKG_VERSION"

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

          echo "All versions match: $TAG_VERSION"

      - name: Check if sdk/node/ changed since last tag
        id: check_changes
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          echo "Current tag: $CURRENT_TAG"

          PREV_TAG=$(git describe --tags --first-parent --match 'node-sdk-v*' --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || true)

          if [ -z "$PREV_TAG" ]; then
            echo "No previous node-sdk tag found -- first release, proceeding."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Comparing $PREV_TAG -> $CURRENT_TAG for sdk/node/ changes"
            CHANGED=$(git diff --name-only "$PREV_TAG" "$CURRENT_TAG" -- sdk/node/)
            if [ -n "$CHANGED" ]; then
              echo "sdk/node/ has changes:"
              echo "$CHANGED"
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "No changes in sdk/node/ since $PREV_TAG -- skipping publish."
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Setup Node.js
        if: steps.check_changes.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        if: steps.check_changes.outputs.changed == 'true'
        working-directory: sdk/node
        run: npm ci

      - name: Lint (tsc --noEmit)
        if: steps.check_changes.outputs.changed == 'true'
        working-directory: sdk/node
        run: npm run lint

      - name: Build
        if: steps.check_changes.outputs.changed == 'true'
        working-directory: sdk/node
        run: npm run build

      - name: Test
        if: steps.check_changes.outputs.changed == 'true'
        working-directory: sdk/node
        run: npm test

      - name: Publish to npm
        if: steps.check_changes.outputs.changed == 'true'
        working-directory: sdk/node
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
